# ModSecurity Rule: Block Bad Bots and Crawlers
# Rule ID: 777007
# Service version: 2.1.0
# Master copy:   /opt/modsec-bot-monitor/rules/777007_block_badbots.conf
# Active copies: /etc/modsecurity.d/777007_block_badbots.conf
#                /usr/local/directadmin/custombuild/custom/modsecurity/conf/777007_block_badbots.conf
#                (CustomBuild mirror — DirectAdmin hosts only)
# Managed by: modsec-bot-monitor service — its watchdog re-syncs the active
#             copies from the master and reloads LiteSpeed on drift.
# Do not edit manually — edit the master copy, then run:
#     systemctl restart modsec-bot-monitor

SecRule REQUEST_HEADERS:User-Agent \
    "@rx (?i)(?:AhrefsBot|Baiduspider|BLEXBot|Barkrowler|SemrushBot|ClaudeBot|YandexBot|Bytespider|AliyunSecBot|BingBot|Mb2345Browser|LieBaoFast|MicroMessenger|Kinza|Datanyze|serpstatbot|spaziodati|AspiegelBot|PetalBot|meta-externalagent|meta-webindexer|ImagesiftBot|Amazonbot|DotBot|GPTBot|MJ12Bot|CCBot|Facebot|FacebookBot|Slackbot|Discordbot|Sogou\sSpider|Exabot|Applebot|Siteimprove|ZoominfoBot|Scrapy|DataForSeoBot|MauiBot|Neevabot|PerplexityBot|anthropic-ai|cohere-ai|Pinterestbot|Timpibot|magpie-crawler)" \
    "id:777007,\
    phase:1,\
    block,\
    status:403,\
    log,\
    msg:'Blocked Bad Bot: %{REQUEST_HEADERS.User-Agent} on %{REQUEST_HEADERS.Host}',\
    logdata:'Matched UA: %{REQUEST_HEADERS.User-Agent}',\
    severity:'WARNING',\
    tag:'BADBOT',\
    tag:'CRAWLER'"
